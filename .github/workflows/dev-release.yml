name: Development Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  prepare:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.release.outputs.commit_sha }}
      ready: ${{ steps.freshness.outputs.ready }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Require newest successful main CI run
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          latest_successful_run="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" \
              --jq ".workflow_runs[0].id"
          )"
          if [[ "$WORKFLOW_RUN_ID" != "$latest_successful_run" ]]; then
            echo "::notice::A newer successful main CI run exists; skipping this stale development candidate."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set development version
        id: release
        if: steps.freshness.outputs.ready == 'true'
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "version=dev-${COMMIT_SHA:0:12}" >> "$GITHUB_OUTPUT"

  release:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    permissions:
      actions: read
      contents: write
      packages: write
    uses: ./.github/workflows/publish-release.yml
    with:
      channel: dev
      version: ${{ needs.prepare.outputs.version }}
      commit_sha: ${{ needs.prepare.outputs.commit_sha }}
    secrets:
      GH_AUTOMATION_TOKEN: ${{ secrets.GH_AUTOMATION_TOKEN }}
