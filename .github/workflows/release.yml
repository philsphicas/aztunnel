name: Stable Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.release.outputs.commit_sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work

      - name: Validate stable tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Stable release tags must match vMAJOR.MINOR.PATCH exactly."
            exit 1
          fi

          commit_sha="$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$commit_sha" origin/main; then
            echo "::error::Tagged commit ${commit_sha} is not reachable from origin/main."
            exit 1
          fi
          if release_is_draft="$(gh release view "$VERSION" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$release_is_draft" != "true" ]]; then
              echo "::error::Release ${VERSION} already exists; stable releases are immutable and never overwritten."
              exit 1
            fi
            echo "::notice::A draft release exists for ${VERSION}; publication will resume without overwriting its assets."
          fi

          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build tagged commit
        run: |
          make build
          make check-installable
          make -C mockrelay build

      - name: Test tagged commit
        run: |
          go test -count=1 ./...
          (cd mockrelay && go test -count=1 ./...)
          (cd e2e && go test -count=1 ./...)

  release:
    needs: validate
    permissions:
      actions: read
      contents: write
      packages: write
    uses: ./.github/workflows/publish-release.yml
    with:
      channel: stable
      version: ${{ needs.validate.outputs.version }}
      commit_sha: ${{ needs.validate.outputs.commit_sha }}
