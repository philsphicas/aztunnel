name: Update Go

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-go
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up latest stable Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: false

      - name: Resolve update policy
        id: versions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          target_go="$(go env GOVERSION)"
          target_go="${target_go#go}"
          if [[ ! "$target_go" =~ ^1\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::setup-go returned an unexpected stable version: $target_go"
            exit 1
          fi

          current_go="$(awk '$1 == "toolchain" { sub(/^go/, "", $2); sub(/\r$/, "", $2); print $2; exit }' go.work)"
          if [[ -z "$current_go" ]]; then
            current_go="$(awk '$1 == "go" { sub(/\r$/, "", $2); print $2; exit }' go.work)"
          fi
          current_baseline="$(awk '$1 == "go" { sub(/\r$/, "", $2); print $2; exit }' go.work)"
          target_baseline="${target_go%.*}.0"

          target_lint="$(gh api repos/golangci/golangci-lint/releases/latest --jq .tag_name)"
          current_lint="$(tr -d '\r\n' < .golangci-version)"
          if [[ ! "$target_lint" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::GitHub returned an unexpected golangci-lint version: $target_lint"
            exit 1
          fi

          requires_review=false
          if [[ "$current_baseline" != "$target_baseline" ]]; then
            requires_review=true
          fi
          if [[ "${current_lint%%.*}" != "${target_lint%%.*}" ]]; then
            requires_review=true
          fi

          echo "current-go=$current_go" >> "$GITHUB_OUTPUT"
          echo "target-go=$target_go" >> "$GITHUB_OUTPUT"
          echo "target-lint=$target_lint" >> "$GITHUB_OUTPUT"
          echo "requires-review=$requires_review" >> "$GITHUB_OUTPUT"

      - name: Verify matching Docker builders are published
        run: |
          docker buildx imagetools inspect "golang:${{ steps.versions.outputs.target-go }}-bookworm" >/dev/null
          docker buildx imagetools inspect "golang:${{ steps.versions.outputs.target-go }}-alpine" >/dev/null

      - name: Update toolchain pins
        run: |
          echo "${{ steps.versions.outputs.target-lint }}" > .golangci-version
          bash scripts/update-go-version.sh "${{ steps.versions.outputs.target-go }}"

      - name: Require automation credential
        shell: bash
        env:
          GH_AUTOMATION_TOKEN: ${{ secrets.GH_AUTOMATION_TOKEN }}
        run: |
          if [[ -z "$GH_AUTOMATION_TOKEN" ]]; then
            echo "::error::GH_AUTOMATION_TOKEN is required to create updater PRs that trigger normal pull-request CI."
            exit 1
          fi

      - name: Create or update pull request
        id: pull-request
        uses: peter-evans/create-pull-request@v8
        with:
          # This must not be GITHUB_TOKEN: updater pushes need to trigger normal PR CI.
          token: ${{ secrets.GH_AUTOMATION_TOKEN }}
          branch: automation/update-go
          delete-branch: true
          commit-message: "chore(go): update Go to ${{ steps.versions.outputs.target-go }}"
          title: "chore(go): update Go to ${{ steps.versions.outputs.target-go }}"
          body: |
            Updates the preferred Go toolchain to `${{ steps.versions.outputs.target-go }}` and golangci-lint to `${{ steps.versions.outputs.target-lint }}`.

            - module `go` directives remain the `major.minor.0` language baseline
            - `go.work` selects the exact preferred patch toolchain
            - Docker builder pins use that same exact toolchain
            - every module is tidied independently

            Feature-version Go updates and golangci-lint major updates require review. Other updates may auto-merge only after required checks pass.
          labels: dependencies

      - name: Enable auto-merge for safe updates
        if: steps.pull-request.outputs.pull-request-number && steps.versions.outputs.requires-review == 'false'
        env:
          GH_TOKEN: ${{ secrets.GH_AUTOMATION_TOKEN }}
        run: gh pr merge --auto --squash "${{ steps.pull-request.outputs.pull-request-number }}"

      - name: Require review for feature updates
        if: steps.pull-request.outputs.pull-request-number && steps.versions.outputs.requires-review == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_AUTOMATION_TOKEN }}
          PR_NUMBER: ${{ steps.pull-request.outputs.pull-request-number }}
        run: |
          if [[ "$(gh pr view "$PR_NUMBER" --json autoMergeRequest --jq '.autoMergeRequest != null')" == "true" ]]; then
            gh pr merge --disable-auto "$PR_NUMBER"
          fi
