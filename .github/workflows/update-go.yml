name: Update Go

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-go
  cancel-in-progress: false

jobs:
  go:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: false

      - name: Update Go and vulnerable modules
        id: update
        run: |
          bash scripts/update-go.sh "$RUNNER_TEMP/message.txt"
          echo "title=$(head -n1 "$RUNNER_TEMP/message.txt")" >> "$GITHUB_OUTPUT"
          tail -n +3 "$RUNNER_TEMP/message.txt" > "$RUNNER_TEMP/body.txt"

      - name: Require automation credential
        shell: bash
        env:
          GH_AUTOMATION_TOKEN: ${{ secrets.GH_AUTOMATION_TOKEN }}
        run: |
          if [[ -z "$GH_AUTOMATION_TOKEN" ]]; then
            echo "::error::GH_AUTOMATION_TOKEN is required to create updater PRs that trigger normal pull-request CI."
            exit 1
          fi

      - name: Create or update pull request
        id: pull-request
        uses: peter-evans/create-pull-request@v8
        with:
          # This must not be GITHUB_TOKEN: updater pushes need to trigger normal PR CI.
          token: ${{ secrets.GH_AUTOMATION_TOKEN }}
          branch: automation/update-go
          delete-branch: true
          commit-message: ${{ steps.update.outputs.title }}
          title: ${{ steps.update.outputs.title }}
          body-path: ${{ runner.temp }}/body.txt
          labels: dependencies

      - name: Enable auto-merge
        if: >
          steps.pull-request.outputs.pull-request-operation == 'created' ||
          steps.pull-request.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ secrets.GH_AUTOMATION_TOKEN }}
        run: gh pr merge --auto --squash "${{ steps.pull-request.outputs.pull-request-number }}"

  golangci-lint:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Determine golangci-lint update
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest="$(gh api repos/golangci/golangci-lint/releases/latest --jq .tag_name)"
          current="$(tr -d '\r\n' < .golangci-version)"
          if [[ ! "$current" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
             [[ ! "$latest" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected exact stable golangci-lint versions; current=$current latest=$latest"
            exit 1
          fi
          update=false
          if [[ "$(printf '%s\n%s\n' "${current#v}" "${latest#v}" | sort -V | tail -n1)" == "${latest#v}" ]] &&
             [[ "$current" != "$latest" ]]; then
            update=true
            echo "$latest" > .golangci-version
          fi
          major=false
          if [[ "${current%%.*}" != "${latest%%.*}" ]]; then
            major=true
          fi
          {
            echo "latest=$latest"
            echo "update=$update"
            echo "major=$major"
          } >> "$GITHUB_OUTPUT"

      - name: Require automation credential
        if: steps.version.outputs.update == 'true'
        shell: bash
        env:
          GH_AUTOMATION_TOKEN: ${{ secrets.GH_AUTOMATION_TOKEN }}
        run: |
          if [[ -z "$GH_AUTOMATION_TOKEN" ]]; then
            echo "::error::GH_AUTOMATION_TOKEN is required to create updater PRs that trigger normal pull-request CI."
            exit 1
          fi

      - name: Create or update pull request
        id: pull-request
        if: steps.version.outputs.update == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GH_AUTOMATION_TOKEN }}
          branch: automation/update-golangci-lint
          delete-branch: true
          commit-message: "chore(deps): update golangci-lint to ${{ steps.version.outputs.latest }}"
          title: "chore(deps): update golangci-lint to ${{ steps.version.outputs.latest }}"
          body: |
            Updates `.golangci-version` to `${{ steps.version.outputs.latest }}`.

            Major golangci-lint updates require review; others auto-merge once required checks pass.
          labels: dependencies

      - name: Enable auto-merge for non-major updates
        if: >
          steps.version.outputs.major == 'false' &&
          (steps.pull-request.outputs.pull-request-operation == 'created' ||
           steps.pull-request.outputs.pull-request-operation == 'updated')
        env:
          GH_TOKEN: ${{ secrets.GH_AUTOMATION_TOKEN }}
        run: gh pr merge --auto --squash "${{ steps.pull-request.outputs.pull-request-number }}"

      - name: Require review for major updates
        if: >
          steps.version.outputs.major == 'true' &&
          (steps.pull-request.outputs.pull-request-operation == 'created' ||
           steps.pull-request.outputs.pull-request-operation == 'updated')
        env:
          GH_TOKEN: ${{ secrets.GH_AUTOMATION_TOKEN }}
          PR_NUMBER: ${{ steps.pull-request.outputs.pull-request-number }}
        run: |
          if [[ "$(gh pr view "$PR_NUMBER" --json autoMergeRequest --jq '.autoMergeRequest != null')" == "true" ]]; then
            gh pr merge --disable-auto "$PR_NUMBER"
          fi
