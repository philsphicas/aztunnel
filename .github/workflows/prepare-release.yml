name: Prepare Maintenance Release

on:
  schedule:
    - cron: "17 16 * * 2"
  workflow_dispatch:
    inputs:
      bump:
        description: "auto for routine patches; explicitly choose a bump for features or breaking changes"
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      force:
        description: Prepare a release even without detected shipping or container changes
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: maintenance-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Require automation credential
        env:
          AUTOMATION_TOKEN: ${{ secrets.GH_AUTOMATION_TOKEN }}
        run: |
          if [[ -z "$AUTOMATION_TOKEN" ]]; then
            echo "::error::GH_AUTOMATION_TOKEN is required so release PRs trigger normal CI and release tags trigger publication."
            exit 1
          fi

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Prepare release request and notes
        id: plan
        uses: actions/github-script@v9
        env:
          RELEASE_BUMP: ${{ inputs.bump || 'auto' }}
          RELEASE_FORCE: ${{ inputs.force || false }}
        with:
          github-token: ${{ secrets.GH_AUTOMATION_TOKEN }}
          script: |
            const { prepare } = require('./.github/scripts/release.cjs');
            await prepare({ github, context, core });

      - name: Format release request
        if: steps.plan.outputs.ready == 'true'
        run: npx --yes prettier --write .github/release.json

      - name: Create or refresh release PR
        id: pr
        if: steps.plan.outputs.ready == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GH_AUTOMATION_TOKEN }}
          branch: automation/maintenance-release
          base: main
          delete-branch: true
          add-paths: .github/release.json
          commit-message: "chore(release): prepare ${{ steps.plan.outputs.version }}"
          title: "chore(release): ${{ steps.plan.outputs.version }}"
          body-path: ${{ steps.plan.outputs.body_path }}
          draft: ${{ steps.plan.outputs.decision_required == 'true' && 'always-true' || 'false' }}

      - name: Mark decided release ready for approval
        if: steps.pr.outputs.pull-request-number != '' && steps.plan.outputs.decision_required == 'false'
        env:
          GH_TOKEN: ${{ secrets.GH_AUTOMATION_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: |
          set -euo pipefail
          if [[ "$(gh pr view "$PR_NUMBER" --json isDraft --jq .isDraft)" == "true" ]]; then
            gh pr ready "$PR_NUMBER"
          fi
