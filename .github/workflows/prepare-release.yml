name: Prepare Maintenance Release

on:
  schedule:
    - cron: "17 16 * * 2"
  workflow_dispatch:
    inputs:
      bump:
        description: "Patch for routine refreshes; choose minor or major for other releases"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read
  actions: read

concurrency:
  group: maintenance-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Require automation credential
        env:
          AUTOMATION_TOKEN: ${{ secrets.GH_AUTOMATION_TOKEN }}
        run: |
          if [[ -z "$AUTOMATION_TOKEN" ]]; then
            echo "::error::GH_AUTOMATION_TOKEN is required so the approved release tag triggers Stable Release."
            exit 1
          fi

      - name: Select version and tested source
        id: plan
        uses: actions/github-script@v9
        env:
          RELEASE_BUMP: ${{ inputs.bump || 'patch' }}
        with:
          script: |
            const { prepare } = require('./.github/scripts/release.cjs');
            await prepare({ github, context, core });

  tag:
    name: Approve ${{ needs.prepare.outputs.version }}
    needs: prepare
    if: github.ref == 'refs/heads/main'
    environment:
      name: stable-release
      url: https://github.com/${{ github.repository }}/compare/${{ needs.prepare.outputs.previous_tag }}...${{ needs.prepare.outputs.source_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
          # Keep the read-only checkout credential for refreshing remote refs.
          persist-credentials: true

      - name: Tag approved source
        uses: actions/github-script@v9
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          RELEASE_PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
        with:
          # GITHUB_TOKEN-created tags do not trigger Stable Release.
          github-token: ${{ secrets.GH_AUTOMATION_TOKEN }}
          script: |
            const { tag } = require('./.github/scripts/release.cjs');
            await tag({ github, context, core });
