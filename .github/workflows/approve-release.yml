name: Approve Maintenance Release

on:
  push:
    branches: [main]
    paths: [.github/release.json]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: maintenance-release
  cancel-in-progress: false

jobs:
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require automation credential
        env:
          AUTOMATION_TOKEN: ${{ secrets.GH_AUTOMATION_TOKEN }}
        run: |
          if [[ -z "$AUTOMATION_TOKEN" ]]; then
            echo "::error::GH_AUTOMATION_TOKEN is required to create a tag that triggers Stable Release."
            exit 1
          fi

      - name: Validate approved request and create immutable tag
        uses: actions/github-script@v9
        with:
          # GITHUB_TOKEN-created tags do not trigger the Stable Release workflow.
          github-token: ${{ secrets.GH_AUTOMATION_TOKEN }}
          script: |
            const { approve } = require('./.github/scripts/release.cjs');
            await approve({ github, context, core });
