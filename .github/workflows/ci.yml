name: CI

on:
  push:
    branches: [main, "dependabot/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work

      - name: Verify Go toolchain synchronization
        run: make check-go-version

      - name: Build
        run: make build

      - name: Verify root module is go-installable
        run: make check-installable

      - name: Build mockrelay
        run: make -C mockrelay build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test maintenance release automation
        run: node --test .github/scripts/release.test.cjs

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work

      - name: Test with coverage
        run: go test -race -coverprofile=coverage.txt ./...

      - name: Test mockrelay
        run: go test -race ./...
        working-directory: mockrelay

      - name: Test e2e (non-e2e-tagged) with coverage
        run: go test -race -coverprofile=coverage-e2e.txt ./...
        working-directory: e2e

      - name: Coverage summary
        run: |
          echo "=== root module ==="
          go tool cover -func=coverage.txt
          echo "=== e2e module ==="
          go tool cover -func=e2e/coverage-e2e.txt

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage.txt
            e2e/coverage-e2e.txt
          retention-days: 14

  container-azurelinux3:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Build Azure Linux 3 image
        run: make docker-azurelinux3 VERSION=ci

      - name: Test with Microsoft Go and OS cryptography
        run: |
          docker build --file Dockerfile.azurelinux3 --target builder \
            --build-arg VERSION=ci --tag aztunnel-builder:azurelinux3 .
          docker run --rm aztunnel-builder:azurelinux3 sh -ec '
            go version -m /aztunnel > /tmp/build-info
            grep -q "microsoft_systemcrypto=1" /tmp/build-info
            grep -q "CGO_ENABLED=0" /tmp/build-info
            go test ./internal/relay ./internal/arc
            cd e2e
            go test -tags=e2e -timeout=5m \
              -run "^(TestMockEmulates|TestMockFeature_ZeroDelayProfile)" ./backends/mock
          '

      - name: Verify runtime uses OS OpenSSL and trust roots
        run: |
          docker run --rm --entrypoint sh aztunnel:azurelinux3 -ec '
            rpm -q openssl-libs ca-certificates
            test -s /etc/pki/tls/certs/ca-bundle.crt
            test "$(readlink -f /etc/ssl/certs/ca-certificates.crt)" = \
              "$(readlink -f /etc/pki/tls/certs/ca-bundle.crt)"
            LD_DEBUG=libs aztunnel --version 2>/tmp/loader.log
            grep -E "calling init: .*/libcrypto.so.3" /tmp/loader.log
          '

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: prettier
        run: npx --yes prettier --check .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work

      - name: Read golangci-lint version
        id: golangci
        run: echo "version=$(tr -d '\r\n' < .golangci-version)" >> "$GITHUB_OUTPUT"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.golangci.outputs.version }}

      - name: golangci-lint (mockrelay)
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.golangci.outputs.version }}
          working-directory: mockrelay

      - name: golangci-lint (e2e)
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.golangci.outputs.version }}
          working-directory: e2e

      - name: golangci-lint (e2e/infra)
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.golangci.outputs.version }}
          working-directory: e2e/infra

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work

      - name: govulncheck
        run: make vulncheck

      - name: govulncheck (mockrelay)
        run: make -C mockrelay vulncheck
