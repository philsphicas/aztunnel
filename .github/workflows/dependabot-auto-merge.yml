name: Dependabot Auto Merge

on:
  pull_request_target:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependabot-auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Require automation credential
        if: >
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          (steps.metadata.outputs.update-type == 'version-update:semver-major' &&
           steps.metadata.outputs.package-ecosystem == 'github_actions')
        env:
          AUTOMATION_TOKEN: ${{ secrets.GH_AUTOMATION_TOKEN }}
        run: |
          if [[ -z "$AUTOMATION_TOKEN" ]]; then
            echo "::error::GH_AUTOMATION_TOKEN is required so Dependabot merges trigger main CI and release preparation can verify the source commit."
            exit 1
          fi

      - name: Approve PR
        if: >
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          (steps.metadata.outputs.update-type == 'version-update:semver-major' &&
           steps.metadata.outputs.package-ecosystem == 'github_actions')
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              event: "APPROVE"
            });

      - name: Enable auto-merge
        if: >
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          (steps.metadata.outputs.update-type == 'version-update:semver-major' &&
           steps.metadata.outputs.package-ecosystem == 'github_actions')
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          # GITHUB_TOKEN merges suppress the main CI run required by releases.
          token: ${{ secrets.GH_AUTOMATION_TOKEN }}
          pull-request-number: ${{ github.event.pull_request.number }}
          merge-method: squash
