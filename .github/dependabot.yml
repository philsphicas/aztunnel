version: 2
updates:
  - package-ecosystem: gomod
    # One entry for the whole go.work workspace, so each update lands in every
    # module at once instead of in overlapping per-directory pull requests.
    directories:
      - /
      - /e2e
      - /e2e/infra
      - /mockrelay
    commit-message:
      prefix: "chore(deps)"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    allow:
      - dependency-type: all
    labels:
      - dependencies
    groups:
      go-minor-patch:
        group-by: dependency-name
        update-types:
          - minor
          - patch
      # Majors are grouped separately so they stay out of auto-merge.
      go-major:
        group-by: dependency-name
        update-types:
          - major
  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: "chore(deps)"
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      gh-actions:
        update-types:
          - minor
          - patch
